<svg width="100%" viewBox="0 0 680 410" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width: 460px; display: block; margin-inline: auto;"><title>Borgator mascot: a cyborg alligator head in profile</title><desc>An alligator head facing right, drawn in profile. The rear half of its skull is covered by a riveted metal plate, and its eye has been replaced by a circular red ocular implant. A short sensor antenna rises from the top of the skull. Interlocking teeth line the open jaws.</desc>

